plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'com.krypton.afkdiagnose'

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// Tests ohne Server, Minecraft-Start oder weitere Test-Bibliotheken.
tasks.register('diagnoseTest', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.krypton.afkdiagnose.DiagnoseSelfTest'
    workingDir = projectDir
}
// Kein JUnit-Runner: auch "test" fuehrt stattdessen unsere echte Java-Test-Suite aus.
tasks.named('test') {
    dependsOn tasks.named('diagnoseTest')
    enabled = false
}
tasks.named('check') { dependsOn tasks.named('diagnoseTest') }
